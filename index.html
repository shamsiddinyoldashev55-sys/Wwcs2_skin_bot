<!DOCTYPE html>
<html lang="uz">
<head><script src="https://telegram.org/js/telegram-web-app.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CS2 Skin Bot</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #161b26;
      --card-border: #232a3b;
      --accent-color: #f39c12;
      --text-main: #ffffff;
      --text-sub: #8a94a6;
      --covert: #eb4b4b;
      --classified: #d32ce6;
      --restricted: #8847ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 90px;
      user-select: none;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background: #11151f;
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .user-level {
      background: #1e2538;
      color: #00ff88;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
    }

    .balance-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1a2130;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1.5px solid var(--accent-color);
      font-weight: bold;
      color: var(--accent-color);
      font-size: 16px;
    }

    .add-btn {
      background: var(--accent-color);
      color: #000;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Grid Layout */
    .container {
      padding: 16px;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .case-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .case-card {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 16px;
      padding: 16px 10px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.2s;
    }

    .case-card:active {
      transform: scale(0.96);
      border-color: var(--accent-color);
    }

    .case-img {
      width: 100%;
      max-width: 120px;
      height: 90px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .case-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    /* Katta Bosiladigan Tugma */
    .case-price-btn {
      width: 100%;
      background: rgba(243, 156, 18, 0.15);
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      padding: 12px 0;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Modal (Keys kontenti va Karta) */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      z-index: 1000;
      justify-content: center;
      align-items: flex-end;
    }

    .modal-content {
      background: #141824;
      width: 100%;
      max-height: 85vh;
      border-radius: 24px 24px 0 0;
      padding: 20px;
      overflow-y: auto;
      border-top: 2px solid var(--accent-color);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .close-btn {
      background: #232a3b;
      border: none;
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
    }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 14px;
    }

    .item-card {
      background: #1c2233;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      border-bottom: 4px solid #ccc;
    }

    .item-card.covert { border-color: var(--covert); }
    .item-card.classified { border-color: var(--classified); }
    .item-card.restricted { border-color: var(--restricted); }

    /* Karta ko'rinishi */
    .card-box {
      background: #0d111a;
      border: 1px dashed var(--accent-color);
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      margin-top: 15px;
    }

    .card-number {
      font-family: monospace;
      font-size: 18px;
      color: #00ff88;
      letter-spacing: 2px;
      margin-top: 8px;
      font-weight: bold;
    }

    /* Katta Bottom Nav */
    .nav-bar {
      position: fixed;
      bottom: 0; width: 100%;
      height: 70px;
      background: #11151f;
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 99;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 600;
      width: 25%;
      height: 100%;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--accent-color);
    }

    .nav-icon {
      font-size: 22px;
      margin-bottom: 3px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="user-level">LVL 1</div>
    <div class="balance-box">
      <span>💰 0</span>
      <button class="add-btn" onclick="openDeposit()">+</button>
    </div>
  </div>

  <!-- Content -->
  <div class="container">
    <div class="section-title">CS2 Keyslar Kolleksiyasi</div>
    
    <div class="case-grid">
      <!-- Kilowatt Case -->
      <div class="case-card" onclick="openCase('Kilowatt Case')">
        <img class="case-img" src="https://community.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_NsVtzdOEdtWwKGZZLVb4cfB48o49E8cd4oA_XvOcXc1XVQ06UVWV4898Bv9xK51O4F1E00U4E1G99F1l9_x1oA_5A2FpwC3_R-Irh1A28m69a/360fx360f">
        <div class="case-title">Kilowatt Case</div>
        <button class="case-price-btn">100 🟡 Ochish</button>
      </div>

      <!-- Revolution Case -->
      <div class="case-card" onclick="openCase('Revolution Case')">
        <img class="case-img" src="https://community.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_NsVtzdOEdtWwKGZZLVb4cfB48o49E8cd4oA_XvOcXc1XVQ06UVWV4898Bv9xK51O4F1E00U4E1G99F1l9_x1oA_5A2FmY381XyvIn/360fx360f">
        <div class="case-title">Revolution Case</div>
        <button class="case-price-btn">250 🟡 Ochish</button>
      </div>

      <!-- Dreams & Nightmares -->
      <div class="case-card" onclick="openCase('Dreams & Nightmares')">
        <img class="case-img" src="https://community.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_NsVtzdOEdtWwKGZZLVb4cfB48o49E8cd4oA_XvOcXc1XVQ06UVWV4898Bv9xK51O4F1E00U4E1G99F1l9_x1oA_5A2Flv3w0G-4zI/360fx360f">
        <div class="case-title">Dreams & Nightmares</div>
        <button class="case-price-btn">500 🟡 Ochish</button>
      </div>

      <!-- Recoil Case -->
      <div class="case-card" onclick="openCase('Recoil Case')">
        <img class="case-img" src="https://community.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_NsVtzdOEdtWwKGZZLVb4cfB48o49E8cd4oA_XvOcXc1XVQ06UVWV4898Bv9xK51O4F1E00U4E1G99F1l9_x1oA_5A2Fmv11mS-mXy/360fx360f">
        <div class="case-title">Recoil Case</div>
        <button class="case-price-btn">750 🟡 Ochish</button>
      </div>
    </div>
  </div>

  <!-- Modal (Keys ichi / Deposit) -->
  <div class="modal" id="appModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Keys Tarkibi</h3>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Navigatsiya -->
  <div class="nav-bar">
    <div class="nav-item">
      <span class="nav-icon">🏠</span>
      <span>Bosh sahifa</span>
    </div>
    <div class="nav-item active">
      <span class="nav-icon">📦</span>
      <span>Keyslar</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">🎒</span>
      <span>Inventar</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">👤</span>
      <span>Profil</span>
    </div>
  </div>

  <script>
    // Telegram Web App tayyorgarligi
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const caseData = {
      "Kilowatt Case": [
        { name: "AK-47 | Inheritance", type: "covert" },
        { name: "AWP | Chrome Cannon", type: "classified" },
        { name: "USP-S | Jawbreaker", type: "restricted" }
      ],
      "Revolution Case": [
        { name: "M4A4 | Temukau", type: "covert" },
        { name: "AK-47 | Head Shot", type: "covert" },
        { name: "AWP | Duality", type: "classified" }
      ],
      "Dreams & Nightmares": [
        { name: "AK-47 | Nightwish", type: "covert" },
        { name: "MP9 | Starlight", type: "covert" }
      ],
      "Recoil Case": [
        { name: "USP-S | Printstream", type: "covert" },
        { name: "AK-47 | Ice Coaled", type: "classified" }
      ]
    };

    function openCase(title) {
      document.getElementById('modalTitle').innerText = title;
      const body = document.getElementById('modalBody');
      
      let html = '<p style="font-size:13px; color:var(--text-sub);">Keysdan tushishi mumkin bo\'lgan skinlar:</p><div class="items-grid">';
      const items = caseData[title] || [];
      
      items.forEach(item => {
        html += `
          <div class="item-card ${item.type}">
            <div style="font-size:28px;">🔪</div>
            <div style="font-size: 12px; font-weight: bold; margin-top:6px;">${item.name}</div>
          </div>
        `;
      });
      html += '</div>';

      body.innerHTML = html;
      document.getElementById('appModal').style.display = 'flex';
    }

    function openDeposit() {
      document.getElementById('modalTitle').innerText = "Hisobni to'ldirish";
      const body = document.getElementById('modalBody');
      
      body.innerHTML = `
        <div class="card-box">
          <div style="font-size: 12px; color: var(--text-sub);">Humo Karta raqami:</div>
          <div class="card-number" onclick="navigator.clipboard.writeText('9860606760894836'); alert('Karta raqami nusxalandi!');">9860 6067 6089 4836</div>
          <div style="font-size: 11px; color: var(--accent-color); margin-top: 6px;">(Ustiga bossangiz nusxalanadi)</div>
        </div>
      `;
      document.getElementById('appModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('appModal').style.display = 'none';
    }
  </script>
</body>
</html>
