<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS2 Skin Bot - Deposit</title>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #161b26;
      --card-border: #232a3b;
      --accent-color: #f39c12;
      --success-color: #10b981;
      --text-main: #ffffff;
      --text-sub: #8a94a6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      user-select: none;
    }

    /* Top Balance Section */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .balance-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1a2130;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--accent-color);
      font-weight: bold;
      color: var(--accent-color);
    }

    .add-btn {
      background: var(--accent-color);
      color: #000;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
    }

    /* Deposit Modal overlay */
    .modal-overlay {
      display: flex;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .deposit-card {
      background: #151a26;
      border: 1px solid #283248;
      width: 100%;
      max-width: 360px;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .deposit-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .deposit-sub {
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 16px;
      line-height: 1.4;
    }

    /* Card Box */
    .card-display {
      background: #0d111a;
      border: 1px dashed #3a4763;
      padding: 12px;
      border-radius: 10px;
      font-family: monospace;
      font-size: 16px;
      color: #00ff88;
      letter-spacing: 1.5px;
      cursor: pointer;
      margin-bottom: 16px;
      transition: background 0.2s;
    }

    .card-display:active {
      background: #182235;
    }

    /* Input Field */
    .input-field {
      width: 100%;
      background: #0d111a;
      border: 1px solid #283248;
      border-radius: 8px;
      padding: 12px;
      color: #fff;
      font-size: 13px;
      margin-bottom: 14px;
      outline: none;
    }

    .input-field::placeholder {
      color: #55627a;
    }

    /* Action Buttons */
    .btn-confirm {
      width: 100%;
      background: #1b7a4e;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .btn-close {
      width: 100%;
      background: #202738;
      color: var(--text-sub);
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }

    /* Alert Box (Skrinshotingizdagi xabar) */
    .custom-alert {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #232a3b;
      border: 1px solid #3a4763;
      padding: 20px;
      border-radius: 14px;
      width: 280px;
      text-align: center;
      z-index: 1100;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .alert-title {
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 8px;
    }

    .alert-msg {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 16px;
      word-break: break-all;
    }

    .alert-btn {
      color: #5b92ff;
      font-weight: bold;
      background: none;
      border: none;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Balance header -->
  <div class="header">
    <div class="balance-box">
      <span>💰 0</span>
      <button class="add-btn" onclick="openDepositModal()">+</button>
    </div>
  </div>

  <!-- Deposit Modal -->
  <div class="modal-overlay" id="depositModal">
    <div class="deposit-card">
      <div class="deposit-title">Humo Karta orqali to'ldirish 💳</div>
      <div class="deposit-sub">Quyidagi Humo kartasiga pul o'tkazing va so'rov yuboring:</div>
      
      <!-- Karta raqamingiz joylashtirildi -->
      <div class="card-display" onclick="copyCardNumber()">
        9860 6067 6089 4836
      </div>

      <input type="text" class="input-field" placeholder="Masalan: Chek raqami yoki Ism-familiya">

      <button class="btn-confirm" onclick="confirmPayment()">To'lovni tasdiqlash 🛈</button>
      <button class="btn-close" onclick="closeDepositModal()">Yopish</button>
    </div>
  </div>

  <!-- Alert Popup (Nusxalanganda chiquvchi oyna) -->
  <div class="custom-alert" id="copyAlert">
    <div class="alert-title">Cs2_skin_bot</div>
    <div class="alert-msg">
      Humo karta raqami nusxalandi:<br>
      <strong style="color: #fff;" id="copiedCardNum">9860606760894836</strong>
    </div>
    <button class="alert-btn" onclick="closeAlert()">OK</button>
  </div>

  <script>
    const CARD_NUMBER = "9860606760894836";

    function copyCardNumber() {
      // Buferga nusxalash
      navigator.clipboard.writeText(CARD_NUMBER).catch(() => {});
      
      // Modal xabarnomani ko'rsatish
      document.getElementById('copiedCardNum').innerText = CARD_NUMBER;
      document.getElementById('copyAlert').style.display = 'block';
    }

    function closeAlert() {
      document.getElementById('copyAlert').style.display = 'none';
    }

    function openDepositModal() {
      document.getElementById('depositModal').style.display = 'flex';
    }

    function closeDepositModal() {
      document.getElementById('depositModal').style.display = 'none';
    }

    function confirmPayment() {
      alert("So'rov yuborildi! Administrator to'lovni tekshirib balansingizni to'ldiradi.");
      closeDepositModal();
    }
  </script>
</body>
</html>
